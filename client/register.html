<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | CodeAlpha Social</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="subtitle">Join and start sharing.</p>

      <div id="formAlert" class="alert alert-error" style="display:none;"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required />
          <div class="form-error" id="nameError"></div>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required minlength="3" maxlength="20" />
          <div class="form-error" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
          <div class="form-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" />
          <div class="form-error" id="passwordError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Sign Up</button>
      </form>

      <p style="margin-top:16px; font-size:0.85rem; text-align:center;">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.redirectIfLoggedIn();

    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('formAlert');
    const submitBtn = document.getElementById('registerBtn');

    function clearErrors() {
      alertBox.style.display = 'none';
      document.querySelectorAll('.form-error').forEach((el) => {
        el.textContent = '';
        el.classList.remove('visible');
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const payload = {
        name: document.getElementById('name').value.trim(),
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const data = await api.register(payload);
        Auth.saveSession(data.token, data.user);
        window.location.href = 'feed.html';
      } catch (err) {
        if (err.errors && err.errors.length) {
          err.errors.forEach((fieldErr) => {
            const el = document.getElementById(`${fieldErr.field}Error`);
            if (el) {
              el.textContent = fieldErr.message;
              el.classList.add('visible');
            }
          });
        } else {
          alertBox.textContent = err.message;
          alertBox.style.display = 'block';
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
