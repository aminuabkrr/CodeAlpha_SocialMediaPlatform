<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search | CodeAlpha Social</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="app-shell">
    <form id="searchForm" style="margin-top:16px; display:flex; gap:8px;">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by name or username..."
        style="flex:1; padding:10px 12px; border:1px solid var(--color-border); border-radius:var(--radius-sm); font-size:0.95rem;"
        autocomplete="off"
      />
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div id="resultsContainer" style="margin-top:16px;"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/follows.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
